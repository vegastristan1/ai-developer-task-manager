name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Ephemeral CI database (service container above); no secrets required.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?sslmode=disable
      # App requires >= 32 chars in production (lib/auth/index.ts); CI-only value.
      AUTH_SECRET: ci-only-not-a-real-secret-but-longer-than-32-characters
      # AI calls are mocked by the test suite; placeholders keep config complete.
      OPENAI_API_KEY: ci-placeholder
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-4o-mini
      NEXT_PUBLIC_APP_URL: http://localhost:4200

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Unit, API, and component tests
        run: npx vitest run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
          retention-days: 7

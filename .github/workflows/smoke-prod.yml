name: Production smoke

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override the URL to smoke test (defaults to SMOKE_BASE_URL)'
        required: false
        type: string

jobs:
  smoke:
    name: Smoke test deployed app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve target URL
        id: target
        env:
          VAR_URL: ${{ vars.SMOKE_BASE_URL }}
          INPUT_URL: ${{ inputs.base_url }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice when not configured
        if: steps.target.outputs.configured != 'true'
        run: |
          echo "::notice::SMOKE_BASE_URL is not set — skipping production smoke. Set it under Settings → Secrets and variables → Actions → Variables."

      - name: Checkout
        if: steps.target.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.target.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.target.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.target.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run smoke test against production
        if: steps.target.outputs.configured == 'true'
        env:
          SMOKE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/smoke.mjs --base-url "$SMOKE_URL"
